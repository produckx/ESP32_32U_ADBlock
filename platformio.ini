[platformio]
default_envs = esp32dev

[env]
; Pinned: this is the toolchain the firmware is tested on (Arduino core 3.3.7).
; Bump deliberately, checking `pio run -e esp32dev` size.
platform = espressif32@5.1.0
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev
